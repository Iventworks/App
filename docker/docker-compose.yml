# Runs the registry image — CI (.gitlab/ci/build.yml) builds and pushes $CI_REGISTRY_IMAGE:latest
# from the default branch. Adjust the image name to your registry and project. Ports and DB paths
# are baked into the image (docker/Dockerfile ENV) — set only what differs for this deployment.
services:
  
  cmp:
    image: gcr.leicraftmc.de/crossover/cmp:latest
    container_name: cmp
    restart: unless-stopped
    ports:
      - "31316:31316"
    environment:
      CMP_LOG_LEVEL: info

      CMP_API_DISABLE_DOCS: false

      CMP_APP_URL: https://cmp.crossover.is-on.net

      # Set to true only when the container is reachable exclusively through ONE reverse proxy
      # that appends the client address to X-Forwarded-For (login rate limiting uses the last entry).
      CMP_TRUST_PROXY: false
      CMP_TIMEZONE: Europe/Berlin
      CMP_MAX_UPLOAD_SIZE_MB: 25

      # SMTP credentials come from a `.env` file next to this compose file (gitignored), e.g.
      #   CMP_SMTP_HOST=mail.example.com
      #   CMP_SMTP_USERNAME=…
      #   CMP_SMTP_PASSWORD=…
      # Without CMP_SMTP_HOST, email (password-reset links) is disabled.
      CMP_SMTP_HOST: ${CMP_SMTP_HOST:-}
      CMP_SMTP_PORT: 465
      CMP_SMTP_USERNAME: ${CMP_SMTP_USERNAME:-}
      CMP_SMTP_PASSWORD: ${CMP_SMTP_PASSWORD:-}
      CMP_SMTP_FROM: '"CMP" <noreply@crossover.info>'
      CMP_SMTP_SECURE: true

    volumes:
      - /opt/crossover/cmp/data:/opt/crossover/cmp/data
      - /opt/crossover/cmp/config:/opt/crossover/cmp/config