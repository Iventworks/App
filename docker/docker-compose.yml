# Runs the registry image — CI (.gitlab/ci/build.yml) builds and pushes $CI_REGISTRY_IMAGE:latest
# from the default branch. Adjust the image name to your registry and project. Ports and DB paths
# are baked into the image (docker/Dockerfile ENV) — set only what differs for this deployment.
services:
  
  iventworks:
    image: gcr.leicraftmc.de/iventworks/app:latest
    container_name: iventworks
    restart: unless-stopped
    # Loopback only: the reverse proxy on this host terminates TLS for IVENTWORKS_APP_URL and forwards
    # here (docs/14). Publish on all interfaces only if the proxy runs on another machine.
    ports:
      - "127.0.0.1:31316:31316"
    environment:
      IVENTWORKS_LOG_LEVEL: info

      # The interactive API docs (/api/docs/v1) stay off on the public host.
      IVENTWORKS_API_DISABLE_DOCS: true

      IVENTWORKS_APP_URL: https://app.iventworks.de

      # Many orgs on this installation: <slug>.app.iventworks.de (wildcard DNS + certificate, or
      # on-demand TLS with `ask` → /api/v1/instance/tls-check), system admins at /admin.
      IVENTWORKS_MULTI_ORG: true

      # Org admins' custom domains need a system admin's approval (after adding them to the reverse
      # proxy) unless the proxy serves new domains by itself — then this can be true.
      IVENTWORKS_CUSTOM_DOMAINS_SELF_SERVICE: false

      # true because the port above is bound to loopback, so every request comes through the one
      # reverse proxy, which appends the client address to X-Forwarded-For (login rate limiting
      # uses the last entry). Set to false if the port is ever published publicly.
      IVENTWORKS_TRUST_PROXY: true
      IVENTWORKS_TIMEZONE: Europe/Berlin
      # Largest file upload; other requests are limited to 2 MB.
      IVENTWORKS_MAX_UPLOAD_SIZE_MB: 25

      # Encrypted backups of the database and uploads (keep the passphrase somewhere safe — without
      # it no backup can be restored). Schedule: cron, in IVENTWORKS_TIMEZONE.
      IVENTWORKS_BACKUP_ENABLED: true
      IVENTWORKS_BACKUP_SCHEDULE: "0 3 * * *"
      IVENTWORKS_BACKUP_PASSPHRASE: ${IVENTWORKS_BACKUP_PASSPHRASE:?set it in docker/.env}
      IVENTWORKS_BACKUP_RETENTION_DAYS: 30
      IVENTWORKS_BACKUP_RETENTION_MIN_COUNT: 3
      # Off-site copies (optional; all four needed). Then only the newest local copy stays.
      IVENTWORKS_BACKUP_S3_ENDPOINT: ${IVENTWORKS_BACKUP_S3_ENDPOINT:-}
      IVENTWORKS_BACKUP_S3_BUCKET: ${IVENTWORKS_BACKUP_S3_BUCKET:-}
      IVENTWORKS_BACKUP_S3_ACCESS_KEY_ID: ${IVENTWORKS_BACKUP_S3_ACCESS_KEY_ID:-}
      IVENTWORKS_BACKUP_S3_SECRET_ACCESS_KEY: ${IVENTWORKS_BACKUP_S3_SECRET_ACCESS_KEY:-}
      IVENTWORKS_BACKUP_S3_PREFIX: iventworks/

      # SMTP credentials come from a `.env` file next to this compose file (gitignored), e.g.
      #   IVENTWORKS_SMTP_HOST=mail.example.com
      #   IVENTWORKS_SMTP_USERNAME=…
      #   IVENTWORKS_SMTP_PASSWORD=…
      # Without IVENTWORKS_SMTP_HOST, email (password-reset links) is disabled.
      IVENTWORKS_SMTP_HOST: ${IVENTWORKS_SMTP_HOST:-}
      IVENTWORKS_SMTP_PORT: 465
      IVENTWORKS_SMTP_USERNAME: ${IVENTWORKS_SMTP_USERNAME:-}
      IVENTWORKS_SMTP_PASSWORD: ${IVENTWORKS_SMTP_PASSWORD:-}
      IVENTWORKS_SMTP_FROM: '"Iventworks" <noreply@iventworks.de>'
      IVENTWORKS_SMTP_SECURE: true

    volumes:
      - /opt/iventworks/data:/opt/iventworks/data
      - /opt/iventworks/config:/opt/iventworks/config
      - /opt/iventworks/backups:/opt/iventworks/backups
