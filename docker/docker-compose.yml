# Runs the registry image — CI (.gitlab/ci/build.yml) builds and pushes $CI_REGISTRY_IMAGE:latest
# from the default branch. Adjust the image name to your registry and project. Ports and DB paths
# are baked into the image (docker/Dockerfile ENV) — set only what differs for this deployment.
# On the server this file goes to /opt/iventworks/compose/ (its .env next to it); the data lives
# beside it under /opt/iventworks/.
services:
  
  iventworks:
    image: gcr.leicraftmc.de/iventworks/app:latest
    container_name: iventworks
    restart: unless-stopped
    # Loopback only: the reverse proxy on this host terminates TLS for IVENTWORKS_APP_URL and forwards
    # here (docs/14). Publish on all interfaces only if the proxy runs on another machine.
    ports:
      - "127.0.0.1:31316:31316"
    environment:
      IVENTWORKS_LOG_LEVEL: info

      # The interactive API docs (/api/docs/v1) stay off on the public host.
      IVENTWORKS_API_DISABLE_DOCS: true

      IVENTWORKS_APP_URL: https://app.iventworks.de

      # Many orgs on this installation: <slug>.app.iventworks.de (wildcard DNS + certificate, or
      # on-demand TLS with `ask` → /api/v1/instance/tls-check), system admins at /admin.
      IVENTWORKS_MULTI_ORG: true

      # Org admins' custom domains need a system admin's approval (after adding them to the reverse
      # proxy) unless the proxy serves new domains by itself — then this can be true.
      IVENTWORKS_CUSTOM_DOMAINS_SELF_SERVICE: false

      # true because the port above is bound to loopback, so every request comes through the one
      # reverse proxy, which appends the client address to X-Forwarded-For (login rate limiting
      # uses the last entry). Set to false if the port is ever published publicly.
      IVENTWORKS_TRUST_PROXY: true
      IVENTWORKS_TIMEZONE: Europe/Berlin
      # Largest file upload; other requests are limited to 2 MB.
      IVENTWORKS_MAX_UPLOAD_SIZE_MB: 25

      # Encrypted backups of the database and uploads (keep the passphrase somewhere safe — without
      # it no backup can be restored). Schedule: cron, in IVENTWORKS_TIMEZONE.
      IVENTWORKS_BACKUP_ENABLED: true
      IVENTWORKS_BACKUP_SCHEDULE: "0 3 * * *"
      IVENTWORKS_BACKUP_PASSPHRASE: ${IVENTWORKS_BACKUP_PASSPHRASE:?set it in the .env next to this file}
      IVENTWORKS_BACKUP_RETENTION_DAYS: 30
      IVENTWORKS_BACKUP_RETENTION_MIN_COUNT: 3
      # Off-site copies (optional; all four needed). Then only the newest local copy stays.
      IVENTWORKS_BACKUP_S3_ENDPOINT: ${IVENTWORKS_BACKUP_S3_ENDPOINT:-}
      IVENTWORKS_BACKUP_S3_BUCKET: ${IVENTWORKS_BACKUP_S3_BUCKET:-}
      IVENTWORKS_BACKUP_S3_ACCESS_KEY_ID: ${IVENTWORKS_BACKUP_S3_ACCESS_KEY_ID:-}
      IVENTWORKS_BACKUP_S3_SECRET_ACCESS_KEY: ${IVENTWORKS_BACKUP_S3_SECRET_ACCESS_KEY:-}
      IVENTWORKS_BACKUP_S3_PREFIX: iventworks/

      # SMTP credentials come from a `.env` file next to this compose file (gitignored), e.g.
      #   IVENTWORKS_SMTP_HOST=mail.example.com
      #   IVENTWORKS_SMTP_USERNAME=…
      #   IVENTWORKS_SMTP_PASSWORD=…
      # Without IVENTWORKS_SMTP_HOST, email (password-reset links) is disabled.
      IVENTWORKS_SMTP_HOST: ${IVENTWORKS_SMTP_HOST:-}
      IVENTWORKS_SMTP_PORT: 465
      IVENTWORKS_SMTP_USERNAME: ${IVENTWORKS_SMTP_USERNAME:-}
      IVENTWORKS_SMTP_PASSWORD: ${IVENTWORKS_SMTP_PASSWORD:-}
      IVENTWORKS_SMTP_FROM: '"Iventworks" <noreply@iventworks.de>'
      IVENTWORKS_SMTP_SECURE: true

      # Web Push: the contact the push services (Google, Apple, …) see — `mailto:` or an https
      # URL; default: IVENTWORKS_APP_URL. The key pair is generated once and kept in the database
      # (it is in the backups); never change it, or every device has to switch push on again.
      IVENTWORKS_WEB_PUSH_SUBJECT: ${IVENTWORKS_WEB_PUSH_SUBJECT:-}

      # Office documents in the browser (optional; needs the `office` service below). The
      # office server's own public host name — never a path or port of the app's host, or its
      # scripts would share the app's origin. The office server calls back on each org's normal
      # address; internally this server only fetches its discovery.
      IVENTWORKS_OFFICE_URL: ${IVENTWORKS_OFFICE_URL:-}
      IVENTWORKS_OFFICE_INTERNAL_URL: ${IVENTWORKS_OFFICE_INTERNAL_URL:-}

    volumes:
      - /opt/iventworks/data:/opt/iventworks/data
      - /opt/iventworks/config:/opt/iventworks/config
      - /opt/iventworks/backups:/opt/iventworks/backups

  # Office documents (docx/xlsx/pptx/odt…) in the browser, with co-editing: Nextcloud Office, the
  # production distribution of Euro-Office (same code as the community builds, which are meant
  # for testing; it doesn't need Nextcloud). Optional: start it with
  # `docker compose --profile office up -d`, then set
  # IVENTWORKS_OFFICE_URL=https://office.ivb.example.org (served by the reverse proxy to the port
  # below) and IVENTWORKS_OFFICE_INTERNAL_URL=http://office. Needs at least 4 GB RAM.
  office:
    profiles: [office]
    # Latest stable release; `docker compose --profile office pull` updates it (releases:
    # https://github.com/nextcloud-releases/Office-DocumentServer/releases).
    image: ghcr.io/nextcloud-releases/office-documentserver:latest
    container_name: iventworks-office
    restart: unless-stopped
    ports:
      - "127.0.0.1:31317:80"
    environment:
      # Iventworks talks WOPI to it (signed calls, keys generated on first start).
      WOPI_ENABLED: "true"
      # Its own document API (not used by Iventworks) stays locked behind JWT; without
      # JWT_SECRET it generates one and keeps it in the private volume.
      JWT_ENABLED: "true"
      # Keep it from fetching private addresses (SSRF): Iventworks is reached on its public address.
      ALLOW_PRIVATE_IP_ADDRESS: "false"
      EXAMPLE_ENABLED: "false"
      # v9.3.8 fixes the data folder's owner under the euro-office path, not this image's
      # nextcloud-office one, so the converter fails with EACCES on App_Data. Fixed upstream
      # (Euro-Office/DocumentServer#578); drop this once a release includes it.
      EO_LIB: /var/lib/nextcloud-office/documentserver
    volumes:
      - /opt/iventworks/office/data:/var/lib/nextcloud-office/documentserver
      # Keys and secrets (incl. the WOPI proof keys) — keep it. Releases after v9.3.8 keep them
      # here; v9.3.8 still keeps them inside the container, so they change when it is recreated
      # (Iventworks fetches new proof keys on its own).
      - /opt/iventworks/office/private:/var/www/nextcloud-office/Data
      - /opt/iventworks/office/logs:/var/log/nextcloud-office/documentserver
